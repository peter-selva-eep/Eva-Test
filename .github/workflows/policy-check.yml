name: Enforce Merge Policy

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Check for merge commits
        run: |
          if git log --merges origin/${{ github.base_ref }}..HEAD | grep .; then
            echo "❌ Merge commits are not allowed"
            exit 1
          fi
