name: Enforce PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch naming
        run: |
          BRANCH="${{ github.head_ref }}"

          if [[ ! "$BRANCH" =~ ^(features|bugs|hotfix|release)/[0-9]+$ ]]; then
            echo "❌ Invalid branch name"
            echo "Allowed formats:"
            echo "  features/<id>"
            echo "  bugs/<id>"
            echo "  hotfix/<id>"
            echo "  release/<id>"
            exit 1
          fi

      - name: Validate PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"

          if [[ ! "$TITLE" =~ ^.+\ \(#[0-9]+\)$ ]]; then
            echo "❌ PR title must follow: <title> (#issue-number)"
            echo "Example: Add login feature (#123)"
            exit 1
          fi

